[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "featureforge-ai"
version = "0.1.0"
description = "AI-powered BDD quality engineering platform — Python engine"
readme = "README.md"
license = { file = "LICENSE.txt" }
authors = [{ name = "David Tran" }]
requires-python = ">=3.11"
dependencies = [
    "pytest>=8.3",
    "pytest-bdd>=8.1",
    "pydantic>=2.7",
]

[project.optional-dependencies]
ui = ["playwright>=1.48"]
llm = ["openai>=1.40"]
telemetry = [
    "opentelemetry-api>=1.27",
    "opentelemetry-sdk>=1.27",
    "opentelemetry-exporter-otlp-proto-http>=1.27",
]
dev = ["ruff>=0.6", "mypy>=1.11", "pytest-html>=4.1"]
all = ["featureforge-ai[ui,llm,telemetry,dev]"]

[project.scripts]
featureforge = "featureforge.cli:main"

# Third-party packs register here, e.g. a private Guidewire pack:
#   [project.entry-points."featureforge.packs"]
#   guidewire = "featureforge_guidewire:PACK"
[project.entry-points."featureforge.packs"]
ai = "featureforge.packs.ai:PACK"
inference = "featureforge.packs.inference:PACK"

[tool.hatch.build.targets.wheel]
packages = ["src/featureforge"]

# ─── pytest ──────────────────────────────────────────────────────────────────
[tool.pytest.ini_options]
minversion = "8.3"
testpaths = ["tests"]
pythonpath = ["src"]
# The FeatureForge plugin is loaded explicitly so it behaves the same
# installed or from a checkout. Default tag filter mirrors cucumber.mjs.
addopts = "-p featureforge.plugin -m 'not wip and not performanceTest and not demo' -ra"
filterwarnings = ["ignore::pytest.PytestUnknownMarkWarning"]
markers = [
    "wip: work in progress, excluded by default",
    "demo: intentionally failing scenarios that showcase the Step Intelligence Layer",
    "no_browser: scenario does not need a browser (kept for parity with the TS engine)",
    "performanceTest: load tests, excluded by default",
]

# ─── FeatureForge settings (env vars and CLI flags override these) ───────────
[tool.featureforge]
env = "qa"
packs = ["ai", "inference"]
reports_dir = "reports"

# Test tiers: what each runner has and what each trigger runs. A selected test
# whose tier isn't available here is skipped with the reason.
[tool.featureforge.tiers]
default = "sim"
available = ["unit", "sim"]   # CI hardware runners: FF_TIERS_AVAILABLE=unit,sim,single_card

[tool.featureforge.tiers.schedules]
commit = ["unit", "sim"]
nightly = ["unit", "sim", "single_card", "multi_card"]
release = ["unit", "sim", "single_card", "multi_card", "rack"]

[tool.featureforge.environments]
qa = "https://qa.test.com/"
dev = "https://dev.test.com/"
staging = "https://staging.test.com/"

[tool.featureforge.lint]
max_scenarios_per_file = 10
max_feature_name = 80
max_scenario_name = 80
max_step_length = 120
max_background_steps = 8
max_scenario_steps = 15
restricted_tags = ["@focus", "@skip"]

# ─── Quality gates for the codebase itself ───────────────────────────────────
[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF", "ANN"]
ignore = ["ANN401"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["ANN"]

[tool.mypy]
python_version = "3.11"
strict = true
mypy_path = "src"
packages = ["featureforge"]

[[tool.mypy.overrides]]
module = ["playwright.*", "openai.*", "opentelemetry.*", "pytest_bdd.*"]
ignore_missing_imports = true
