# FeatureForge AI (Python) — GitLab CI
#
# Every trigger runs the tiers it can afford, then a release gate decides:
#   merge requests / pushes  → commit schedule (unit + sim)       → gate commit
#   nightly (scheduled)      → + single_card, multi_card on cards  → gate nightly
#   release tags             → every tier, incl. rack              → gate release
#
# Run history (.featureforge/history) is cached between pipelines: it holds the
# last known-good run used for "what changed?", perf baselines and flakiness.
# Hardware jobs need runners tagged `accelerator` and these CI/CD variables:
#   FF_DEVICE_BACKEND   "your_device_pkg.backend:card_factory"
#   FF_MANIFEST         path to the build's component manifest (JSON)

default:
  image: python:3.12-bookworm
  cache:
    - key: pip-$CI_COMMIT_REF_SLUG
      paths: [.cache/pip]
    - key: featureforge-history-$CI_DEFAULT_BRANCH
      paths: [.featureforge/history]

variables:
  PIP_CACHE_DIR: "$CI_PROJECT_DIR/.cache/pip"
  HEADLESS: "true"
  ENV: "qa"

stages: [static, qualify, gate, insight]

.install: &install
  - python -m pip install --upgrade pip
  - pip install -e ".[all]"
  - python -m playwright install --with-deps chromium

.reports: &reports
  artifacts:
    when: always
    expire_in: 30 days
    reports:
      junit: reports/junit/junit.xml
    paths: [reports/]

lint-and-types:
  stage: static
  script:
    - *install
    - ruff check src tests steps
    - ruff format --check src tests steps
    - mypy
    - featureforge lint
    - featureforge plan

commit:
  stage: qualify
  rules:
    - if: $CI_PIPELINE_SOURCE != "schedule" && $CI_COMMIT_TAG == null
  script:
    - *install
    - mkdir -p reports/cucumber reports/junit
    - >
      pytest --ff-schedule commit
      --junitxml=reports/junit/junit.xml
      --cucumberjson=reports/cucumber/cucumber_report.json
    - featureforge gate --policy commit
  <<: *reports

nightly:
  stage: qualify
  tags: [accelerator]
  rules:
    - if: $CI_PIPELINE_SOURCE == "schedule"
  variables:
    FF_TIERS_AVAILABLE: "unit,sim,single_card,multi_card"
  script:
    - *install
    - mkdir -p reports/cucumber reports/junit
    - >
      pytest --ff-schedule nightly --ff-reruns 1
      --junitxml=reports/junit/junit.xml
      --cucumberjson=reports/cucumber/cucumber_report.json
    - featureforge gate --policy nightly
    - featureforge history
  <<: *reports

release:
  stage: qualify
  tags: [accelerator-rack]
  rules:
    - if: $CI_COMMIT_TAG
  variables:
    FF_TIERS_AVAILABLE: "unit,sim,single_card,multi_card,rack"
  script:
    - *install
    - mkdir -p reports/cucumber reports/junit
    - >
      pytest --ff-schedule release
      --junitxml=reports/junit/junit.xml
      --cucumberjson=reports/cucumber/cucumber_report.json
    - featureforge escapes
    - featureforge gate --policy release
  <<: *reports

intelligence-demo:
  stage: insight
  allow_failure: true # the demo scenario fails on purpose
  rules:
    - if: $CI_PIPELINE_SOURCE != "schedule" && $CI_COMMIT_TAG == null
  script:
    - *install
    - featureforge run --tags "@demo" -- --ff-no-history
  artifacts:
    when: always
    paths: [reports/intelligence/]
